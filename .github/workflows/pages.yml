# Veröffentlicht die Website-Vorschau auf GitHub Pages
{"name": "Pages", "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "read", "pages": "write", "id-token": "write"}, "concurrency": {"group": "pages", "cancel-in-progress": true}, "jobs": {"deploy": {"runs-on": "ubuntu-latest", "environment": {"name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}"}, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Seite vorbereiten", "run": "mkdir _site && if [ -f site.zip ]; then unzip -q site.zip -d _site; else rsync -a --exclude .git --exclude .github --exclude README.md ./ _site/; fi && touch _site/.nojekyll"}, {"uses": "actions/configure-pages@v5"}, {"uses": "actions/upload-pages-artifact@v3", "with": {"path": "_site"}}, {"id": "deployment", "uses": "actions/deploy-pages@v4"}]}}}
